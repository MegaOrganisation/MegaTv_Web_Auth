<style>
:root{
  --brand-indigo:#5b63d6;--brand-blue:#3f9ae6;--brand-teal:#1fa8a0;--brand-green:#5fbf5a;
  --brand-gold:#f2b43c;--brand-orange:#f4904a;--brand-coral:#ee6a54;--brand-magenta:#d8497f;
  --grad-spectrum:linear-gradient(110deg,#3f9ae6 0%,#1fa8a0 19%,#5fbf5a 35%,#f2b43c 55%,#ee6a54 76%,#d8497f 100%);
  --c-bg:#06070a;--c-text:#eef1f7;--c-text2:rgba(238,241,247,0.62);--c-text3:rgba(238,241,247,0.36);
  --c-border:rgba(255,255,255,0.09);--c-border2:rgba(255,255,255,0.16);
  --c-surface:rgba(255,255,255,0.04);--c-surface2:rgba(255,255,255,0.07);
  --font-display:'Bricolage Grotesque',sans-serif;--font-body:'Instrument Sans',sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font-body);background:var(--c-bg);color:var(--c-text);
  min-height:100vh;overflow-x:hidden;overflow-y:auto;position:relative;
  display:flex;justify-content:center;align-items:flex-start;padding:24px 24px 92px;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(216,73,127,0.3);color:#fff;}

/* ===== POSTER WALL ===== */
.wall{position:fixed;inset:-8% -4%;z-index:0;display:flex;gap:18px;justify-content:center;transform:rotate(-6deg) scale(1.2);filter:saturate(0.92);}
.col{display:flex;flex-direction:column;gap:18px;flex:0 0 auto;width:clamp(150px,21vw,250px);animation:wallUp var(--dur,52s) linear infinite;}
.col.down{animation-name:wallDown;}
.col:nth-child(1){--dur:52s;}.col:nth-child(2){--dur:62s;}.col:nth-child(3){--dur:46s;}
.col:nth-child(4){--dur:58s;}.col:nth-child(5){--dur:50s;}.col:nth-child(6){--dur:66s;}.col:nth-child(7){--dur:54s;}
@keyframes wallUp{from{transform:translateY(0);}to{transform:translateY(-50%);}}
@keyframes wallDown{from{transform:translateY(-50%);}to{transform:translateY(0);}}
.poster{
  width:100%;aspect-ratio:2/3;border-radius:12px;position:relative;overflow:hidden;flex:0 0 auto;
  box-shadow:0 18px 40px -16px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.05) inset;background:#0c0e14;
}
.poster img{width:100%;height:100%;object-fit:cover;display:block;}
.poster.grad::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,0.14),transparent 42%);}
.poster.grad::before{content:'';position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(transparent,rgba(0,0,0,0.55));}
.p1{background:radial-gradient(120% 90% at 30% 20%,#2a4d7a,#0b1320 70%);}
.p2{background:radial-gradient(120% 90% at 70% 30%,#7a2f4d,#1a0d14 72%);}
.p3{background:radial-gradient(120% 90% at 40% 25%,#1f6b66,#08161a 72%);}
.p4{background:radial-gradient(120% 90% at 60% 20%,#8a6320,#1a1206 72%);}
.p5{background:radial-gradient(120% 90% at 35% 30%,#43356e,#100b1c 72%);}
.p6{background:radial-gradient(120% 90% at 65% 25%,#8a4326,#1a0d08 72%);}
.p7{background:radial-gradient(120% 90% at 45% 20%,#2f5a7a,#0a1420 72%);}
.p8{background:radial-gradient(120% 90% at 55% 30%,#6e2f5a,#170b13 72%);}
.p9{background:radial-gradient(120% 90% at 40% 25%,#357a4d,#0a1a12 72%);}
.p10{background:radial-gradient(120% 90% at 60% 20%,#7a6b2f,#171407 72%);}

.scrim{position:fixed;inset:0;z-index:1;background:
  radial-gradient(120% 80% at 50% 12%,transparent,rgba(6,7,10,0.5) 55%,rgba(6,7,10,0.9) 100%),
  linear-gradient(180deg,rgba(6,7,10,0.42),rgba(6,7,10,0.7));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;}
.aurora{position:fixed;border-radius:50%;filter:blur(110px);opacity:0.4;mix-blend-mode:screen;z-index:1;pointer-events:none;}
.aurora.a1{width:56vw;height:56vw;background:radial-gradient(circle,rgba(63,154,230,0.6),transparent 65%);top:-20vw;left:-12vw;}
.aurora.a2{width:50vw;height:50vw;background:radial-gradient(circle,rgba(216,73,127,0.5),transparent 65%);bottom:-12vw;right:-12vw;}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0.5;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");}

/* ===== CARD ===== */
.card{
  position:relative;z-index:10;width:100%;max-width:440px;margin:auto;
  background:linear-gradient(165deg,rgba(20,22,30,0.84),rgba(10,12,17,0.84));
  border:1px solid var(--c-border2);border-radius:30px;padding:34px 34px 30px;
  box-shadow:0 50px 120px -36px rgba(0,0,0,0.9),0 1px 0 rgba(255,255,255,0.08) inset;
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  text-align:center;opacity:1;animation:rise 0.9s var(--ease);
}
@keyframes rise{from{transform:translateY(24px) scale(0.98);}to{transform:none;}}
.card::before{content:'';position:absolute;top:0;left:26px;right:26px;height:3px;border-radius:0 0 99px 99px;background:var(--grad-spectrum);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);opacity:0.92;}
.card::after{content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:58%;height:30px;border-radius:50%;background:var(--grad-spectrum);filter:blur(22px);opacity:0.32;pointer-events:none;}

.brand{display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.brand img{height:30px;width:auto;filter:drop-shadow(0 4px 18px rgba(0,0,0,0.5));}

.tv-chip{
  display:inline-flex;align-items:center;gap:9px;padding:6px 13px;border-radius:99px;white-space:nowrap;
  background:var(--c-surface);border:1px solid var(--c-border2);
  font-size:11.5px;font-weight:600;color:var(--c-text2);margin-bottom:18px;
}
.tv-chip svg{width:14px;height:14px;color:var(--brand-teal);}
.tv-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-teal);box-shadow:0 0 9px var(--brand-teal);}

.code-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;}
.code-label{font-size:11.5px;color:var(--c-text3);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;}
.code-pill{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:0.16em;padding:7px 16px;border-radius:11px;color:#fff;
  background:linear-gradient(165deg,rgba(216,73,127,0.18),rgba(63,154,230,0.14));border:1px solid rgba(216,73,127,0.4);}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:rgba(8,9,13,0.6);border:1px solid var(--c-border);border-radius:99px;margin-bottom:18px;}
.tab{flex:1;padding:10px;border-radius:99px;font-family:var(--font-body);font-size:13.5px;font-weight:600;color:var(--c-text2);cursor:pointer;transition:all 0.3s var(--ease);border:none;background:none;}
.tab.active{background:#fff;color:#0a0c12;box-shadow:0 4px 14px -4px rgba(0,0,0,0.5);}

/* google */
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:11px;
  padding:13px;border-radius:14px;font-family:var(--font-body);font-size:14.5px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,0.05);border:1px solid var(--c-border2);color:var(--c-text);transition:all 0.25s var(--ease);
}
.btn-google:hover{background:rgba(255,255,255,0.09);transform:translateY(-1px);}
.btn-google svg{width:18px;height:18px;flex:0 0 auto;}
.btn-google span{white-space:nowrap;}

.divider{display:flex;align-items:center;gap:12px;margin:18px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--c-border);}
.divider span{font-size:10.5px;font-weight:700;letter-spacing:0.12em;color:var(--c-text3);text-transform:uppercase;white-space:nowrap;}

form{display:flex;flex-direction:column;gap:12px;text-align:left;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:var(--c-text2);padding-left:2px;}
.field input{
  width:100%;padding:13px 16px;border-radius:13px;font-size:15px;font-family:var(--font-body);
  background:rgba(8,9,13,0.7);border:1px solid var(--c-border2);color:var(--c-text);outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
}
.field input::placeholder{color:var(--c-text3);}
.field input:focus{border-color:rgba(91,99,214,0.7);box-shadow:0 0 0 3px rgba(91,99,214,0.18);background:rgba(8,9,13,0.95);}
.forgot{align-self:flex-end;font-size:12.5px;color:var(--c-text2);background:none;border:none;cursor:pointer;padding:2px;transition:color 0.2s;}
.forgot:hover{color:var(--c-text);}

.btn{
  position:relative;margin-top:4px;width:100%;padding:15px;border:none;cursor:pointer;
  border-radius:99px;font-family:var(--font-body);font-weight:700;font-size:15px;color:#fff;
  background:var(--grad-spectrum);background-size:180% 100%;background-position:0% 50%;
  box-shadow:0 12px 36px -10px rgba(216,73,127,0.6),0 1px 0 rgba(255,255,255,0.25) inset;
  transition:transform 0.35s var(--ease),background-position 0.6s var(--ease),box-shadow 0.35s var(--ease),opacity 0.3s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn:hover:not(:disabled){transform:translateY(-2px);background-position:100% 50%;box-shadow:0 18px 46px -10px rgba(216,73,127,0.75);}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:0.7;cursor:default;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn.loading .spinner{display:block;}

.status{display:none;margin-top:16px;font-size:13px;font-weight:600;padding:12px 15px;border-radius:13px;line-height:1.45;text-align:left;}
.status.show{display:block;opacity:1;animation:rise 0.4s var(--ease);}
.status.error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.32);color:#fca5a5;}
.status.success{background:rgba(31,168,160,0.14);border:1px solid rgba(31,168,160,0.38);color:#6ee7df;}
.status.info{background:var(--c-surface);border:1px solid var(--c-border2);color:var(--c-text2);}

.done{display:none;flex-direction:column;align-items:center;gap:16px;padding:10px 0 6px;}
.done.show{display:flex;opacity:1;animation:rise 0.6s var(--ease);}
.done .check{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,rgba(31,168,160,0.25),rgba(31,168,160,0.06));
  border:1px solid rgba(31,168,160,0.5);box-shadow:0 0 40px -8px rgba(31,168,160,0.5);}
.done .check svg{width:34px;height:34px;color:var(--brand-teal);}
.done h2{font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;}
.done p{font-size:14px;color:var(--c-text2);line-height:1.55;max-width:300px;}

.foot{margin-top:18px;font-size:11px;color:var(--c-text3);}
.foot a{color:var(--c-text2);}

/* ===== BOTTOM PROMO BANNER ===== */
.banner{
  position:fixed;left:0;right:0;bottom:0;z-index:20;height:62px;
  display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:0 20px;
  background:linear-gradient(180deg,rgba(10,12,17,0.6),rgba(6,7,10,0.92));
  border-top:1px solid var(--c-border2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.banner .b-left{display:flex;align-items:center;gap:11px;min-width:0;}
.banner .b-left img{height:18px;width:auto;flex:0 0 auto;}
.banner .b-txt{font-size:13px;color:var(--c-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.banner .b-txt b{color:var(--c-text);font-weight:600;}
.banner .b-plats{display:flex;gap:7px;}
.banner .b-plats span{font-size:10.5px;font-weight:600;letter-spacing:0.04em;color:var(--c-text3);padding:4px 9px;border-radius:99px;background:var(--c-surface);border:1px solid var(--c-border);white-space:nowrap;}
.banner .b-cta{
  display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:99px;flex:0 0 auto;
  font-size:13px;font-weight:700;color:#fff;text-decoration:none;
  background:var(--grad-spectrum);background-size:180% 100%;background-position:0 50%;
  box-shadow:0 8px 24px -10px rgba(216,73,127,0.6);transition:transform 0.3s var(--ease),background-position 0.5s var(--ease);white-space:nowrap;
}
.banner .b-cta:hover{transform:translateY(-1px);background-position:100% 50%;}
.banner .b-cta svg{width:14px;height:14px;}

@media (prefers-reduced-motion:reduce){.col{animation:none!important;}.card,.status,.done{animation:none!important;}}
@media(max-width:680px){.banner .b-plats{display:none;}}
@media(max-width:520px){.card{padding:28px 22px;}.banner .b-txt{display:none;}.banner{height:58px;}}
</style>
</head>

<script>
/* ====== CONFIG ====== */
const SUPABASE_URL = "https://lciimaytmryruyooktkd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjaWltYXl0bXJ5cnV5b29rdGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTEwNDAsImV4cCI6MjA5NDkyNzA0MH0.xj8ITmbNeKLShcdKcqvpy--V8B7EcBHkWGkNaENjilI";

/* TMDB — colle ta clé API gratuite (themoviedb.org → Paramètres → API).
   Laisse vide pour utiliser les tuiles dégradées de secours. */
const TMDB_API_KEY = "cc67660b03cc3bd6b90063fff45b43f2";

/* lien de téléchargement de l'app (à personnaliser) */
const DOWNLOAD_URL = "#";

/* ====== INIT ====== */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const tvCode = new URLSearchParams(window.location.search).get('code');
if(tvCode){
  document.getElementById('code-row').style.display = 'flex';
  document.getElementById('code-display').textContent = tvCode;
}
document.getElementById('download-cta').href = DOWNLOAD_URL;

let mode = 'login';       // 'login' | 'signup'
let pairing = false;      // guard against double pairing

/* ====== POSTER WALL (TMDB + fallback) ====== */
async function fetchTmdbPosters(){
  if(!TMDB_API_KEY) return null;
  try{
    const out = [];
    for(const page of [1,2,3]){
      const r = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&page=${page}`);
      if(!r.ok) throw new Error('tmdb');
      const j = await r.json();
      (j.results||[]).forEach(m=>{ if(m.poster_path) out.push(`https://image.tmdb.org/t/p/w342${m.poster_path}`); });
    }
    return out.length ? out : null;
  }catch(e){ return null; }
}
function buildWall(posters){
  const wall = document.getElementById('wall');
  wall.innerHTML = '';
  const COLS = 4, PER_COL = 7;
  let idx = 0;
  for(let c=0;c<COLS;c++){
    const col = document.createElement('div');
    col.className = 'col' + (c % 2 ? ' down' : '');
    let html = '';
    for(let i=0;i<PER_COL;i++){
      if(posters){
        const src = posters[idx % posters.length]; idx++;
        html += `<div class="poster"><img src="${src}" alt="" referrerpolicy="no-referrer"></div>`;
      }else{
        const v = ((c*PER_COL+i) % 10) + 1;
        html += `<div class="poster grad p${v}"></div>`;
      }
    }
    col.innerHTML = html + html; // duplicate => seamless 50% loop
    wall.appendChild(col);
  }
}
(async()=>{ buildWall(await fetchTmdbPosters()); })();

/* ====== UI MODE ====== */
function setMode(m){
  mode = m;
  document.getElementById('tab-login').classList.toggle('active', m==='login');
  document.getElementById('tab-signup').classList.toggle('active', m==='signup');
  document.getElementById('forgot').style.display = m==='login' ? 'block' : 'none';
  document.getElementById('password').setAttribute('autocomplete', m==='login'?'current-password':'new-password');
  document.querySelector('#submit-btn .btn-label').textContent = m==='login' ? 'Se connecter et jumeler' : 'Créer mon compte et jumeler';
  hideStatus();
}

/* ====== AUTH ====== */
async function handleSubmit(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!email || !password){ showStatus("Renseigne ton email et ton mot de passe.", "error"); return; }
  if(!tvCode){ showStatus("Aucun code de jumelage trouvé dans l'URL. Relance le jumelage depuis ta TV.", "error"); return; }

  setLoading(true); hideStatus();

  const { data, error } = await sb.functions.invoke('tv-auth-complete', {
    body: {
      code: tvCode,
      email: email,
      password: password,
      intent: mode
    }
  });

  if(error){ setLoading(false); showStatus("Erreur : " + error.message, "error"); return; }
  if(data && data.error){ setLoading(false); showStatus(data.error, "error"); return; }

  // Authenticate locally in the browser to maintain session on the web page as well
  await sb.auth.signInWithPassword({ email, password });
  showDone();
}

async function handleGoogle(){
  if(!tvCode){ showStatus("Aucun code de jumelage trouvé dans l'URL.", "error"); return; }
  // revient sur cette même page (avec ?code=...) après OAuth → jumelage auto
  const { error } = await localStorage.setItem('megatv_pending_pair', tvCode);
  sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(error){ showStatus("Google indisponible : " + error.message, "error"); }
}

async function handleForgot(){
  const email = document.getElementById('email').value.trim();
  if(!email){ showStatus("Saisis d'abord ton adresse email ci-dessus.", "info"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if(error){ showStatus("Erreur : " + error.message, "error"); }
  else showStatus("Email de réinitialisation envoyé à " + email + ".", "success");
}

async function completePairing(user){
  if(pairing) return; pairing = true;
  setLoading(true);
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    pairing = false;
    setLoading(false);
    showStatus("Session introuvable. Connecte-toi à nouveau.", "error");
    return;
  }

  const { data, error } = await sb.functions.invoke('tv-auth-approve', {
    body: {
      code: tvCode,
      refresh_token: session.refresh_token
    }
  });

  setLoading(false);
  if(error){ pairing = false; showStatus("Erreur de jumelage : " + error.message, "error"); return; }
  if(data && data.error){ pairing = false; showStatus("Erreur de jumelage : " + data.error, "error"); return; }
  showDone();
}

function showDone(){
  document.getElementById('auth-zone').style.display = 'none';
  document.getElementById('code-row').style.display = 'none';
  document.getElementById('done').classList.add('show');
}

/* QR pairing: never auto-approve a sticky browser session from a previous account.
 * Only auto-complete after an explicit Google OAuth return (pending flag). */
sb.auth.getSession().then(async ({ data:{ session } })=>{
  if(!tvCode) return;
  const pendingOauth = localStorage.getItem('megatv_pending_pair') === tvCode;
  if(session?.user && pendingOauth){
    localStorage.removeItem('megatv_pending_pair');
    completePairing(session.user);
    return;
  }
  if(session?.user){
    await sb.auth.signOut();
  }
});
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'SIGNED_IN' && session?.user && tvCode &&
      localStorage.getItem('megatv_pending_pair') === tvCode){
    localStorage.removeItem('megatv_pending_pair');
    completePairing(session.user);
  }
});

/* ====== helpers ====== */
function setLoading(on){
  const btn = document.getElementById('submit-btn');
  btn.disabled = on; btn.classList.toggle('loading', on);
}
function showStatus(text, type){ const el=document.getElementById('status'); el.textContent=text; el.className='status show '+type; }
function hideStatus(){ document.getElementById('status').className='status'; }
</script>
